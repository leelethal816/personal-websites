name: Deploy Lee site to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "sites/lee/**"
      - ".github/workflows/deploy-lee.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: lee-site
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.AZURE_ACR_NAME_LEE }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.AZURE_ACR_LOGIN_SERVER_LEE }}/$IMAGE_NAME:$IMAGE_TAG \
            -f sites/lee/Dockerfile \
            sites/lee

      - name: Push Docker image
        run: |
          docker push ${{ vars.AZURE_ACR_LOGIN_SERVER_LEE }}/$IMAGE_NAME:$IMAGE_TAG

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME_LEE }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_LEE }} \
            --image ${{ vars.AZURE_ACR_LOGIN_SERVER_LEE }}/$IMAGE_NAME:$IMAGE_TAG

      - name: Show deployed revision image
        run: |
          az containerapp show \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME_LEE }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_LEE }} \
            --query properties.template.containers[0].image \
            --output tsv

  print-image-and-tag:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Print image and tag
        run: |
          echo "Deployed image: ${{ vars.AZURE_ACR_LOGIN_SERVER_LEE }}/$IMAGE_NAME:$IMAGE_TAG"